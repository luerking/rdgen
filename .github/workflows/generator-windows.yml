name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string


env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      rustdesk-version: ${{ inputs.version }}
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml
      
      - name: change appname to custom
        if: env.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml
          # ./libs/portable/Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./libs/portable/Cargo.toml
          # ./libs/portable/src/main.rs
          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs
          # ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ env.filename }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          # ./src/lang/en.rs
          # change powered by rustdek to powered by compname
          if [ ! -z "${{ env.compname }}" ]; then
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.compname }}|g' {} \;
          fi
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|g' {} \;
          # res/msi/Package/License.rtf 刻意不替换。
          # 该文件是 AGPL-3.0 的许可声明，改写其中的版权人与项目名属于
          # 篡改许可文本，AGPL §4 明确禁止。安装时显示原始许可声明即可，
          # 这也让内部用户清楚产品来源。

      # 清理运行时会落到磁盘上的 rustdesk 硬编码名称
      #
      # 上面几步只改了版本资源与 UI 文案，但源码里还有几处字符串常量，
      # 编译后会在运行时产生真实文件/进程，容易被用户或安全软件识别：
      #   libs/portable/src/main.rs:324  RuntimeBroker_rustdesk.exe
      #       每次启动都会把系统 RuntimeBroker.exe 复制到安装目录并改成该名，
      #       伪装系统进程名却带 rustdesk 后缀，是杀软重点盯的行为。
      #   libs/portable/src/main.rs:23   rustdesk-verified-
      #       自动更新校验的临时文件前缀。
      #   src/platform/windows.rs:2022   C:\ProgramData\RustDesk\RustDeskCustomClientStaging
      #       公共目录，同机所有用户可见。
      #   src/platform/windows.rs:1250   %LOCALAPPDATA%\rustdesk-sciter\rustdesk.exe
      #       便携版服务登录助手路径。
      #
      # 用 filename 而不是 appname：这几处是文件名/进程名语义，filename 通常
      # 不含空格，避免 taskkill /IM 与路径引用出问题。
      #
      # 风险说明：sciter 那两处属便携版服务登录助手，改动后路径仍由同一函数
      # 生成，内部自洽；但属边缘路径，若后续发现服务登录异常，优先回看这里。
      - name: remove residual rustdesk file and process names
        if: env.appname != 'rustdesk'
        shell: bash
        run: |
          NAME="${{ env.filename }}"
          PORTABLE=./libs/portable/src/main.rs
          WINPLAT=./src/platform/windows.rs

          if [ ! -f "$PORTABLE" ] || [ ! -f "$WINPLAT" ]; then
            echo "ERROR: source files missing - checkout step did not run?"
            ls -l "$PORTABLE" "$WINPLAT" 2>/dev/null || true
            exit 1
          fi

          # 统计目标出现次数（替换前），用于确认确实改到了东西。
          # 只检查"替换后无残留"是不够的：源码结构一变，模式全部匹配不到，
          # 替换后同样"无残留"，会静默放过。
          count_hits() {
            grep -o 'RuntimeBroker_rustdesk\.exe\|"rustdesk-verified-"\|"RustDeskCustomClientStaging"\|"rustdesk-sciter"' \
              "$PORTABLE" "$WINPLAT" 2>/dev/null | wc -l | tr -d ' '
          }

          BEFORE=$(count_hits)
          echo "matches before patch: $BEFORE"

          # 已经是清理过的状态（例如 workflow 重试）：不算失败。
          # 与"源码结构变化"的区别在于，后者连新名称也不存在。
          count_new() {
            grep -o "RuntimeBroker_${NAME}\.exe\|\"${NAME}-verified-\"\|\"${NAME}CustomClientStaging\"\|\"${NAME}-sciter\"" \
              "$PORTABLE" "$WINPLAT" 2>/dev/null | wc -l | tr -d ' '
          }

          if [ "$BEFORE" -eq 0 ]; then
            ALREADY=$(count_new)
            if [ "$ALREADY" -gt 0 ]; then
              echo "already patched ($ALREADY new-name match), nothing to do"
              exit 0
            fi
            echo "FAIL: neither rustdesk names nor ${NAME} names were found."
            echo "      This RustDesk version may have restructured the relevant files."
            exit 1
          fi

          # RuntimeBroker_rustdesk.exe（定义 + taskkill 两处一并替换）
          sed -i "s|RuntimeBroker_rustdesk\.exe|RuntimeBroker_${NAME}.exe|g" "$PORTABLE"
          # 更新校验临时文件前缀
          sed -i "s|\"rustdesk-verified-\"|\"${NAME}-verified-\"|" "$PORTABLE"
          # 公共 staging 目录 C:\ProgramData\RustDesk\RustDeskCustomClientStaging
          sed -i "s|\.join(\"RustDesk\")|.join(\"${NAME}\")|" "$WINPLAT"
          sed -i "s|\.join(\"RustDeskCustomClientStaging\")|.join(\"${NAME}CustomClientStaging\")|" "$WINPLAT"
          # 便携版服务登录助手 %LOCALAPPDATA%\rustdesk-sciter\rustdesk.exe
          sed -i "s|\"rustdesk-sciter\"|\"${NAME}-sciter\"|" "$WINPLAT"
          sed -i "s|dir\.join(\"rustdesk\.exe\")|dir.join(\"${NAME}.exe\")|" "$WINPLAT"

          AFTER=$(count_hits)
          echo "matches after patch: $AFTER"

          echo "=== result ==="
          grep -n "RuntimeBroker_${NAME}\|${NAME}-verified-\|${NAME}CustomClientStaging\|${NAME}-sciter\|join(\"${NAME}\")" \
            "$PORTABLE" "$WINPLAT" || true

          if [ "$AFTER" -ne 0 ]; then
            echo "FAIL: $AFTER residual match(es) remain after patching."
            exit 1
          fi
          echo "OK: cleared $BEFORE rustdesk identifier(s)"

      # 把 Cargo 包名与核心库名从 rustdesk / librustdesk 改成自定义标识
      #
      # 目的：消除二进制里的 crate 名（strings 或 panic 消息可提取），
      # 以及安装目录里肉眼可见的 <name>.dll。
      #
      # 联动清单（必须成套改，漏一处即编译失败或运行时找不到 DLL）：
      #   Cargo.toml  [package] name / default-run
      #   Cargo.toml  [lib] name              → 产物 <id>.dll
      #   Cargo.lock  根包 name               → cargo --locked 会校验，不改直接报错
      #   build.py    hbb_name                → 找 target/release/<id>.exe
      #   src/*.rs    use librustdesk::       → lib 名变了必须同步
      #   flutter/... CMakeLists 的 RUSTDESK_LIB 与 RENAME
      #   flutter/... main.cpp 的 LoadLibraryA
      #   flutter/lib/models/native_model.dart → Linux .so 路径
      #
      # Rust crate 名只允许 ASCII 字母数字与 - _，含中文的 filename 会被清洗，
      # 此时回退为 appcore。想让 dll 名与品牌一致，filename 请用英文。
      - name: rename rust crate and core library
        if: env.appname != 'rustdesk'
        shell: bash
        run: |
          # run 默认带 -e -o pipefail，任何未命中的 grep 都会中断脚本，
          # 因此下面的检索一律 || true。
          set -o pipefail

          RUSTID=$(printf '%s' "${{ env.filename }}" | tr -cd 'A-Za-z0-9_-' | tr 'A-Z' 'a-z')
          [ -z "$RUSTID" ] && RUSTID="appcore"
          case "$RUSTID" in
            [0-9]*) RUSTID="app${RUSTID}" ;;
          esac
          case "$RUSTID" in
            service|naming) RUSTID="${RUSTID}core" ;;
          esac
          AUTHOR="${{ env.compname }}"
          [ -z "$AUTHOR" ] && AUTHOR="$RUSTID"

          echo "crate id: $RUSTID"
          echo "author  : $AUTHOR"

          # 只检索实际存在的路径，避免 grep 因路径不存在返回 2
          PATHS=""
          for p in ./src ./libs ./flutter ./res ./Cargo.toml ./build.py; do
            [ -e "$p" ] && PATHS="$PATHS $p"
          done
          echo "scan paths:$PATHS"

          count_hits() {
            grep -ro 'librustdesk' $PATHS 2>/dev/null | wc -l | tr -d ' ' || true
          }

          BEFORE=$(count_hits)
          echo "librustdesk occurrences before: $BEFORE"
          if [ "$BEFORE" = "0" ]; then
            # 已改过（例如 workflow 重试）：只要包名不再是 rustdesk 就算完成。
            # 不比对具体新名，避免冲突改名后重跑误判。
            CUR=$(grep -m1 '^name = ' ./Cargo.toml 2>/dev/null | sed -n 's/^name = "\(.*\)"$/\1/p')
            if [ -n "$CUR" ] && [ "$CUR" != "rustdesk" ]; then
              echo "already renamed to '$CUR', nothing to do"
              exit 0
            fi
            echo "FAIL: no librustdesk occurrences and package is still 'rustdesk'."
            echo "      This RustDesk version may have restructured."
            exit 1
          fi

          # 与 Cargo.lock 里的依赖包重名会让 cargo 报 two packages named ...
          # 此时 lock 根包仍叫 rustdesk，故命中即为真正的依赖冲突。
          if [ -f ./Cargo.lock ] && grep -qx "name = \"${RUSTID}\"" ./Cargo.lock 2>/dev/null; then
            echo "crate id collides with an existing package, adding suffix"
            RUSTID="${RUSTID}app"
          fi

          # lib 名（Cargo.toml 的 [lib] name、各处 use、dll/so 路径一并覆盖）
          grep -rl 'librustdesk' $PATHS 2>/dev/null | while read -r f; do
            sed -i "s|librustdesk|${RUSTID}|g" "$f"
          done

          # Cargo 包名、默认运行目标、作者
          sed -i "s|^name = \"rustdesk\"\$|name = \"${RUSTID}\"|" ./Cargo.toml
          sed -i "s|^default-run = \"rustdesk\"\$|default-run = \"${RUSTID}\"|" ./Cargo.toml
          sed -i "s|^authors = \[\"rustdesk <info@rustdesk.com>\"\]\$|authors = [\"${AUTHOR}\"]|" ./Cargo.toml

          # Cargo.lock 根包条目：不改会被 cargo --locked 拒绝
          if [ -f ./Cargo.lock ]; then
            sed -i "s|^name = \"rustdesk\"\$|name = \"${RUSTID}\"|" ./Cargo.lock
          fi

          # build.py 用它定位 target/release 下的主二进制
          if [ -f ./build.py ]; then
            sed -i "s|hbb_name = 'rustdesk' +|hbb_name = '${RUSTID}' +|" ./build.py
          fi

          echo "=== verify ==="
          grep -m1 '^name = ' ./Cargo.toml || true
          sed -n '/^\[lib\]/,/^\[/p' ./Cargo.toml | grep -m1 '^name = ' || true
          grep -m1 '^default-run' ./Cargo.toml || true
          grep -m1 '^authors' ./Cargo.toml || true
          grep -m1 'hbb_name = ' ./build.py 2>/dev/null || true
          grep -n 'LoadLibraryA' ./flutter/windows/main.cpp 2>/dev/null || true
          grep -n 'RENAME' ./flutter/windows/CMakeLists.txt 2>/dev/null || true

          LEFT=$(count_hits)
          echo "librustdesk remaining: $LEFT"

          if [ "$LEFT" != "0" ]; then
            echo "FAIL: $LEFT librustdesk reference(s) remain"
            exit 1
          fi
          if ! grep -q "LoadLibraryA(\"${RUSTID}.dll\")" ./flutter/windows/main.cpp 2>/dev/null; then
            echo "FAIL: main.cpp does not load ${RUSTID}.dll"
            exit 1
          fi
          if ! grep -qx "name = \"${RUSTID}\"" ./Cargo.toml 2>/dev/null; then
            echo "FAIL: package name was not renamed"
            exit 1
          fi
          echo "OK: crate and core library renamed to ${RUSTID}"

      - name: fix registry if appname has a space
        if: contains(env.appname, ' ')
        continue-on-error: true
        shell: bash
        run: |
          #./src/platform/windows.rs
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|{subkey}|\\\"{subkey}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\.{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          
      - name: change company name
        if: env.compname != 'Purslane Ltd'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|r"Purslane(?: Tech Pte\\.)? Ltd"|"${{ env.compname }}"|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./src/main.rs
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./src/main.rs
             
      - name: change url to custom
        if: env.urlLink != 'https://rustdesk.com'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.urlLink }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.urlLink }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart

